<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직장인 개인 업무관리 칸반보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e293b', // 네이비/슬레이트 중심의 차분한 직장인 테마
                        accent: '#2563eb',  // 포인트 강조색 (블루 단일톤)
                        accentHover: '#1d4ed8'
                    }
                }
            }
        }
    </script>
    <style>
        /* 깔끔하고 전문적인 폰트 및 스크롤바 세팅 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* 얇고 정돈된 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 드래그 상태 시각화 */
        .card-dragging {
            opacity: 0.45;
            transform: scale(0.98);
        }
        .drag-over-column {
            background-color: #f1f5f9 !important;
            border-color: #94a3b8 !important;
        }

        /* 모달 백드롭 애니메이션 */
        .modal-fade-in {
            animation: fadeIn 0.15s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none text-sm">

    <!-- 1. 최상단 헤더 네비게이션 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-4 md:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-slate-900 text-white flex items-center justify-center font-bold text-base">
                    W
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-tight flex items-center gap-2">
                        직장인 개인 업무관리 칸반보드
                        <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">로컬 단독 실행</span>
                    </h1>
                </div>
            </div>

            <!-- 상단 주요 액션 버튼 그룹 -->
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="openTaskModal()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium flex items-center gap-1.5 transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    새 업무 추가
                </button>
                <button onclick="openWeeklyReportModal()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded font-medium flex items-center gap-1.5 transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    주간 보고 보기
                </button>
                
                <div class="h-5 w-px bg-slate-300 mx-1 hidden md:block"></div>

                <!-- 유틸리티 메뉴 드롭다운/버튼 -->
                <button onclick="clearCompletedTasks()" title="완료 목록의 업무들을 모두 삭제합니다" class="px-2.5 py-1.5 text-xs text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded border border-slate-300 transition-colors">
                    완료 업무 정리
                </button>
                <button onclick="resetAllData()" title="모든 업무를 기본 샘플 데이터 상태로 초기화합니다" class="px-2.5 py-1.5 text-xs text-rose-600 hover:bg-rose-50 rounded border border-rose-200 transition-colors">
                    초기화
                </button>
            </div>
        </div>
    </header>

    <!-- 2. 업무 현황 요약 대시보드 바 -->
    <section class="bg-white border-b border-slate-200 px-4 md:px-8 py-3.5">
        <div class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 text-left">
            <div class="bg-slate-50 border border-slate-200 rounded p-2.5">
                <span class="text-xs text-slate-500 font-medium block">전체 업무</span>
                <span id="stat-total" class="text-lg font-bold text-slate-800 mt-0.5 block">0</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded p-2.5">
                <span class="text-xs text-slate-500 font-medium block">진행 중</span>
                <span id="stat-inprogress" class="text-lg font-bold text-blue-600 mt-0.5 block">0</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded p-2.5">
                <span class="text-xs text-slate-500 font-medium block">완료 업무</span>
                <span id="stat-done" class="text-lg font-bold text-emerald-600 mt-0.5 block">0</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded p-2.5">
                <span class="text-xs text-slate-500 font-medium block">진행 완료율</span>
                <span id="stat-rate" class="text-lg font-bold text-slate-800 mt-0.5 block">0%</span>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded p-2.5 col-span-2 sm:col-span-1">
                <span class="text-xs text-rose-600 font-medium block">마감 임박 / 지연</span>
                <span id="stat-urgent" class="text-lg font-bold text-rose-600 mt-0.5 block">0</span>
            </div>
        </div>
    </section>

    <!-- 3. 빠른 필터 바 -->
    <section class="px-4 md:px-8 py-3 bg-slate-100/80 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 overflow-x-auto pb-1 md:pb-0">
            <div class="flex items-center gap-1.5 flex-nowrap shrink-0">
                <span class="text-xs font-semibold text-slate-500 mr-1.5 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                    필터:
                </span>
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn active-filter px-3 py-1 rounded text-xs font-medium border bg-white border-slate-300 text-slate-800">
                    전체
                </button>
                <button onclick="setFilter('today')" id="filter-today" class="filter-btn px-3 py-1 rounded text-xs font-medium border border-transparent text-slate-600 hover:bg-white hover:border-slate-300">
                    오늘 할 일
                </button>
                <button onclick="setFilter('this-week')" id="filter-this-week" class="filter-btn px-3 py-1 rounded text-xs font-medium border border-transparent text-slate-600 hover:bg-white hover:border-slate-300">
                    이번 주
                </button>
                <button onclick="setFilter('urgent')" id="filter-urgent" class="filter-btn px-3 py-1 rounded text-xs font-medium border border-transparent text-slate-600 hover:bg-white hover:border-slate-300">
                    마감 임박/지연
                </button>
                <button onclick="setFilter('important')" id="filter-important" class="filter-btn px-3 py-1 rounded text-xs font-medium border border-transparent text-slate-600 hover:bg-white hover:border-slate-300">
                    중요 업무 (높음)
                </button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn px-3 py-1 rounded text-xs font-medium border border-transparent text-slate-600 hover:bg-white hover:border-slate-300">
                    완료 업무
                </button>
            </div>

            <!-- 업무 검색 폼 -->
            <div class="relative w-44 md:w-60 shrink-0">
                <input type="text" id="searchInput" oninput="renderBoard()" placeholder="업무명, 담당자 검색..." class="w-full pl-8 pr-3 py-1 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:border-blue-600">
                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
        </div>
    </section>

    <!-- 4. 칸반보드 메인 컬럼 영역 (4개 상태) -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 overflow-hidden flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 h-full flex-1 items-start">
            
            <!-- 1) 할 일 (todo) -->
            <div class="flex flex-col bg-slate-100 rounded border border-slate-300 h-full max-h-[calc(100vh-250px)]">
                <div class="p-3 border-b border-slate-200 bg-white rounded-t flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                        <h2 class="font-bold text-slate-800 text-sm">할 일</h2>
                        <span id="count-todo" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold border border-slate-200">0</span>
                    </div>
                    <button onclick="openTaskModal('todo')" title="이 컬럼에 바로 추가" class="text-slate-400 hover:text-slate-800 p-1 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <div id="col-todo" data-status="todo" class="kanban-column flex-1 p-2 space-y-2 overflow-y-auto min-h-[160px] transition-colors">
                    <!-- 업무 카드 동적 삽입 -->
                </div>
            </div>

            <!-- 2) 진행 중 (inprogress) -->
            <div class="flex flex-col bg-slate-100 rounded border border-slate-300 h-full max-h-[calc(100vh-250px)]">
                <div class="p-3 border-b border-slate-200 bg-white rounded-t flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                        <h2 class="font-bold text-slate-800 text-sm">진행 중</h2>
                        <span id="count-inprogress" class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-semibold border border-blue-200">0</span>
                    </div>
                    <button onclick="openTaskModal('inprogress')" title="이 컬럼에 바로 추가" class="text-slate-400 hover:text-slate-800 p-1 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <div id="col-inprogress" data-status="inprogress" class="kanban-column flex-1 p-2 space-y-2 overflow-y-auto min-h-[160px] transition-colors">
                    <!-- 업무 카드 동적 삽입 -->
                </div>
            </div>

            <!-- 3) 검토 (review) -->
            <div class="flex flex-col bg-slate-100 rounded border border-slate-300 h-full max-h-[calc(100vh-250px)]">
                <div class="p-3 border-b border-slate-200 bg-white rounded-t flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <h2 class="font-bold text-slate-800 text-sm">검토</h2>
                        <span id="count-review" class="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-semibold border border-amber-200">0</span>
                    </div>
                    <button onclick="openTaskModal('review')" title="이 컬럼에 바로 추가" class="text-slate-400 hover:text-slate-800 p-1 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <div id="col-review" data-status="review" class="kanban-column flex-1 p-2 space-y-2 overflow-y-auto min-h-[160px] transition-colors">
                    <!-- 업무 카드 동적 삽입 -->
                </div>
            </div>

            <!-- 4) 완료 (done) -->
            <div class="flex flex-col bg-slate-100 rounded border border-slate-300 h-full max-h-[calc(100vh-250px)]">
                <div class="p-3 border-b border-slate-200 bg-white rounded-t flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                        <h2 class="font-bold text-slate-800 text-sm">완료</h2>
                        <span id="count-done-badge" class="text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-semibold border border-emerald-200">0</span>
                    </div>
                    <button onclick="openTaskModal('done')" title="이 컬럼에 바로 추가" class="text-slate-400 hover:text-slate-800 p-1 rounded">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
                <div id="col-done" data-status="done" class="kanban-column flex-1 p-2 space-y-2 overflow-y-auto min-h-[160px] transition-colors">
                    <!-- 업무 카드 동적 삽입 -->
                </div>
            </div>

        </div>
    </main>

    <!-- 모달 1: 업무 카드 등록 및 수정 모달 -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-md border border-slate-200 shadow-xl w-full max-w-lg modal-fade-in overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base">새 업무 추가</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="taskForm" onsubmit="handleTaskSubmit(event)" class="p-5 space-y-4">
                <input type="hidden" id="taskId">

                <!-- 상태 (숨김 또는 변경용) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">상태</label>
                    <select id="taskStatus" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600 bg-white">
                        <option value="todo">할 일</option>
                        <option value="inprogress">진행 중</option>
                        <option value="review">검토</option>
                        <option value="done">완료</option>
                    </select>
                </div>

                <!-- 업무명 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">업무명 <span class="text-rose-500">*</span></label>
                    <input type="text" id="taskTitle" required placeholder="예: 4분기 부서 예산안 결재 상신" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600">
                </div>

                <!-- 2열 구성 (마감일, 중요도) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">마감일 <span class="text-rose-500">*</span></label>
                        <input type="date" id="taskDueDate" required class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">중요도</label>
                        <select id="taskPriority" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600 bg-white">
                            <option value="높음">높음</option>
                            <option value="보통" selected>보통</option>
                            <option value="낮음">낮음</option>
                        </select>
                    </div>
                </div>

                <!-- 2열 구성 (업무 유형, 담당자/협업자) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">업무 유형</label>
                        <select id="taskCategory" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600 bg-white">
                            <option value="보고">보고</option>
                            <option value="회의">회의</option>
                            <option value="자료작성">자료작성</option>
                            <option value="요청사항">요청사항</option>
                            <option value="개인업무">개인업무</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">담당자 / 협업자</label>
                        <input type="text" id="taskAssignee" placeholder="예: 본인, 김팀장, 이대리" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600">
                    </div>
                </div>

                <!-- 상세 메모 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">상세 메모</label>
                    <textarea id="taskDesc" rows="3" placeholder="주요 협의 사항, 참고 링크, 세부 체크리스트 등" class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm focus:outline-none focus:border-blue-600"></textarea>
                </div>

                <!-- 하단 버튼 -->
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-200">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-700 hover:bg-slate-100 text-xs font-medium">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 모달 2: 주간 업무보고 팝업 모달 -->
    <div id="weeklyReportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-md border border-slate-200 shadow-xl w-full max-w-2xl modal-fade-in flex flex-col max-h-[85vh]">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div>
                    <h3 class="font-bold text-slate-800 text-base">주간 업무보고서 미리보기</h3>
                    <p class="text-xs text-slate-500 mt-0.5">현재 칸반보드 데이터를 기반으로 자동 취합된 텍스트입니다.</p>
                </div>
                <button onclick="closeWeeklyReportModal()" class="text-slate-400 hover:text-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto">
                <div class="relative">
                    <textarea id="weeklyReportText" readonly class="w-full h-80 p-3.5 bg-slate-50 border border-slate-300 rounded font-mono text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500 select-all leading-relaxed whitespace-pre"></textarea>
                </div>
                <div id="copyToast" class="text-center text-xs font-medium text-emerald-600 hidden mt-2">
                    ✓ 클립보드에 복사되었습니다! 메일이나 메신저에 바로 붙여넣기(Ctrl+V)하세요.
                </div>
            </div>

            <div class="px-5 py-3 border-t border-slate-200 bg-slate-50 flex items-center justify-between">
                <span class="text-xs text-slate-500">메일, 결재판, 메신저 보고용으로 최적화됨</span>
                <div class="flex items-center gap-2">
                    <button onclick="closeWeeklyReportModal()" class="px-3.5 py-1.5 border border-slate-300 rounded text-slate-700 hover:bg-slate-100 text-xs font-medium">닫기</button>
                    <button onclick="copyWeeklyReport()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        보고 내용 복사하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. 알림/메시지 토스트 (alert 대체) -->
    <div id="systemToast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded shadow-lg transition-opacity duration-200 opacity-0 pointer-events-none flex items-center gap-2">
        <span id="toastMessage">안내 메시지</span>
    </div>

    <!-- 자바스크립트 로직 -->
    <script>
        // --- 1. 기본 상태 및 샘플 데이터 정의 ---
        const STORAGE_KEY = 'office_kanban_tasks_v1';
        let currentFilter = 'all';
        let draggedTaskId = null;

        // 오늘 기준 날짜 계산 유틸
        const now = new Date();
        const formatDate = (date) => date.toISOString().split('T')[0];
        const addDays = (days) => {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return formatDate(d);
        };

        // 초기 기본 샘플 데이터 5건
        const defaultTasks = [
            {
                id: 'task-1',
                title: '3분기 프로젝트 성과 분석 및 주간회의 자료 작성',
                desc: '각 파트별 취합 수치 교차 검증 및 발표 슬라이드 10장 내외 구성',
                dueDate: addDays(0), // 오늘 마감
                priority: '높음',
                category: '자료작성',
                assignee: '본인, 이대리',
                status: 'inprogress',
                createdAt: new Date().toISOString()
            },
            {
                id: 'task-2',
                title: '하반기 팀 인프라 보안점검 체크리스트 회신',
                desc: '보안팀 가이드라인 준수 여부 및 계정 권한 전수조사',
                dueDate: addDays(-1), // 마감일 지남
                priority: '높음',
                category: '요청사항',
                assignee: '본인',
                status: 'review',
                createdAt: new Date().toISOString()
            },
            {
                id: 'task-3',
                title: '외주 개발사 견적서 비교 및 품의서 작성',
                desc: '3개사 비교견적표 첨부 및 유지보수 요율 조건 명시',
                dueDate: addDays(2), // 이번 주
                priority: '보통',
                category: '보고',
                assignee: '본인, 박과장',
                status: 'todo',
                createdAt: new Date().toISOString()
            },
            {
                id: 'task-4',
                title: '사내 신규 협업툴 기능 가이드 사전 열람 및 테스트',
                desc: '주요 메신저 연동 및 캘린더 싱크 기능 동작 확인',
                dueDate: addDays(4),
                priority: '낮음',
                category: '개인업무',
                assignee: '본인',
                status: 'todo',
                createdAt: new Date().toISOString()
            },
            {
                id: 'task-5',
                title: '팀 주간 정기 티타임 및 업무 분장 협의',
                desc: '11월 2주차 긴급 태스크 우선순위 조율 완료',
                dueDate: addDays(-2),
                priority: '보통',
                category: '회의',
                assignee: '팀 전체',
                status: 'done',
                createdAt: new Date().toISOString()
            }
        ];

        // tasks 상태 관리
        let tasks = [];

        // 데이터 로드
        function loadTasks() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    tasks = JSON.parse(stored);
                } else {
                    tasks = [...defaultTasks];
                    saveTasks();
                }
            } catch (e) {
                console.error("로컬스토리지 로드 실패:", e);
                tasks = [...defaultTasks];
            }
        }

        // 데이터 저장
        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                console.error("로컬스토리지 저장 실패:", e);
                showToast("데이터 저장에 실패했습니다. (저장공간 부족 가능성)");
            }
            updateDashboard();
        }

        // --- 2. 칸반 렌더링 및 필터링 ---
        function renderBoard() {
            const columns = {
                todo: document.getElementById('col-todo'),
                inprogress: document.getElementById('col-inprogress'),
                review: document.getElementById('col-review'),
                done: document.getElementById('col-done')
            };

            // 컬럼 비우기
            Object.values(columns).forEach(col => col.innerHTML = '');

            const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const todayStr = formatDate(new Date());

            // 컬럼별 카운터
            const counts = { todo: 0, inprogress: 0, review: 0, done: 0 };

            tasks.forEach(task => {
                // 검색어 매칭 필터
                const matchSearch = task.title.toLowerCase().includes(searchTerm) || 
                                    (task.assignee && task.assignee.toLowerCase().includes(searchTerm)) ||
                                    (task.desc && task.desc.toLowerCase().includes(searchTerm));

                if (!matchSearch) return;

                // 빠른 필터 체크
                if (!checkFilterMatch(task, todayStr)) return;

                counts[task.status] = (counts[task.status] || 0) + 1;

                // 카드 생성 및 주입
                const cardEl = createTaskCardElement(task);
                if (columns[task.status]) {
                    columns[task.status].appendChild(cardEl);
                }
            });

            // 각 컬럼 개수 뱃지 갱신
            document.getElementById('count-todo').textContent = counts.todo;
            document.getElementById('count-inprogress').textContent = counts.inprogress;
            document.getElementById('count-review').textContent = counts.review;
            document.getElementById('count-done-badge').textContent = counts.done;

            // 각 컬럼이 비어있을 때 빈 상태 안내
            Object.entries(columns).forEach(([statusKey, colEl]) => {
                if (colEl.children.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'text-center py-8 text-xs text-slate-400 border border-dashed border-slate-200 rounded';
                    emptyMsg.textContent = '업무가 없습니다';
                    colEl.appendChild(emptyMsg);
                }
            });

            updateDashboard();
        }

        // 필터 조건 판단
        function checkFilterMatch(task, todayStr) {
            if (currentFilter === 'all') return true;

            const isDone = task.status === 'done';

            if (currentFilter === 'today') {
                return task.dueDate === todayStr;
            }
            if (currentFilter === 'this-week') {
                const due = new Date(task.dueDate + 'T00:00:00');
                const now = new Date();
                const day = now.getDay() || 7; // 월요일=1, 일요일=7
                const monday = new Date(now);
                monday.setDate(now.getDate() - day + 1);
                monday.setHours(0,0,0,0);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                sunday.setHours(23,59,59,999);
                return due >= monday && due <= sunday;
            }
            if (currentFilter === 'urgent') {
                if (isDone) return false;
                const due = new Date(task.dueDate + 'T23:59:59');
                const diffDays = Math.ceil((due - new Date()) / (1000 * 60 * 60 * 24));
                return diffDays <= 1; // 오늘/내일 마감이거나 이미 지난 경우
            }
            if (currentFilter === 'important') {
                return task.priority === '높음';
            }
            if (currentFilter === 'completed') {
                return task.status === 'done';
            }
            return true;
        }

        // 카드 엘리먼트 돔 생성
        function createTaskCardElement(task) {
            const card = document.createElement('div');
            card.className = 'bg-white p-3 rounded border border-slate-200 shadow-xs hover:border-slate-400 transition-all cursor-grab active:cursor-grabbing group text-left';
            card.setAttribute('draggable', 'true');
            card.id = `task-card-${task.id}`;

            // 마감일 계산 (오늘, 임박, 지연)
            const todayStr = formatDate(new Date());
            const isOverdue = task.dueDate < todayStr && task.status !== 'done';
            const isToday = task.dueDate === todayStr && task.status !== 'done';
            const isUrgent = isOverdue || isToday;

            // 중요도 스타일
            let priorityBadge = '';
            if (task.priority === '높음') {
                priorityBadge = `<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-semibold">높음</span>`;
            } else if (task.priority === '보통') {
                priorityBadge = `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200 text-[10px]">보통</span>`;
            } else {
                priorityBadge = `<span class="px-1.5 py-0.5 rounded bg-slate-50 text-slate-500 border border-slate-200 text-[10px]">낮음</span>`;
            }

            // 업무 유형 뱃지
            const categoryBadge = `<span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 text-[10px]">${task.category || '기타'}</span>`;

            // 마감일 텍스트 스타일
            let dueBadgeClass = 'text-slate-500';
            let dueTextPrefix = '';
            if (task.status === 'done') {
                dueBadgeClass = 'text-slate-400 line-through';
            } else if (isOverdue) {
                dueBadgeClass = 'text-rose-600 font-bold bg-rose-50 px-1 py-0.5 rounded';
                dueTextPrefix = '지연: ';
            } else if (isToday) {
                dueBadgeClass = 'text-amber-600 font-bold bg-amber-50 px-1 py-0.5 rounded';
                dueTextPrefix = '오늘 마감: ';
            }

            card.innerHTML = `
                <div class="flex items-center justify-between gap-1 mb-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        ${categoryBadge}
                        ${priorityBadge}
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                        <button onclick="editTask('${task.id}')" title="수정" class="text-slate-400 hover:text-slate-800 p-0.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                        </button>
                        <button onclick="deleteTask('${task.id}')" title="삭제" class="text-slate-400 hover:text-rose-600 p-0.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>

                <div class="font-medium text-slate-800 text-xs mb-1.5 line-clamp-2 leading-snug ${task.status === 'done' ? 'line-through text-slate-400' : ''}">
                    ${escapeHtml(task.title)}
                </div>

                ${task.desc ? `<p class="text-[11px] text-slate-500 mb-2 line-clamp-2 leading-relaxed">${escapeHtml(task.desc)}</p>` : ''}

                <div class="flex items-center justify-between text-[11px] pt-1.5 border-t border-slate-100 text-slate-500">
                    <div class="flex items-center gap-1 ${dueBadgeClass}" title="마감일">
                        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span>${dueTextPrefix}${task.dueDate}</span>
                    </div>
                    <div class="text-[10px] text-slate-600 truncate max-w-[90px]" title="담당자: ${escapeHtml(task.assignee || '미지정')}">
                        ${task.assignee ? '👤 ' + escapeHtml(task.assignee) : ''}
                    </div>
                </div>
            `;

            // HTML5 드래그 앤 드롭 이벤트 바인딩
            card.addEventListener('dragstart', (e) => {
                draggedTaskId = task.id;
                card.classList.add('card-dragging');
                e.dataTransfer.setData('text/plain', task.id);
                e.dataTransfer.effectAllowed = 'move';
            });

            card.addEventListener('dragend', () => {
                draggedTaskId = null;
                card.classList.remove('card-dragging');
                document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over-column'));
            });

            return card;
        }

        // --- 3. 컬럼 드래그 앤 드롭 처리 ---
        function initDragAndDrop() {
            const columns = document.querySelectorAll('.kanban-column');

            columns.forEach(col => {
                col.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    col.classList.add('drag-over-column');
                });

                col.addEventListener('dragleave', (e) => {
                    // 자식 요소 진입 시 무시
                    if (!col.contains(e.relatedTarget)) {
                        col.classList.remove('drag-over-column');
                    }
                });

                col.addEventListener('drop', (e) => {
                    e.preventDefault();
                    col.classList.remove('drag-over-column');
                    const targetStatus = col.getAttribute('data-status');
                    const taskId = e.dataTransfer.getData('text/plain') || draggedTaskId;

                    if (taskId && targetStatus) {
                        moveTaskStatus(taskId, targetStatus);
                    }
                });
            });
        }

        function moveTaskStatus(taskId, newStatus) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.status !== newStatus) {
                task.status = newStatus;
                saveTasks();
                renderBoard();
                
                const statusNames = { todo: '할 일', inprogress: '진행 중', review: '검토', done: '완료' };
                showToast(`[${task.title.substring(0, 12)}...] 상태가 '${statusNames[newStatus]}'(으)로 변경되었습니다.`);
            }
        }

        // --- 4. 대시보드 요약 지표 업데이트 ---
        function updateDashboard() {
            const total = tasks.length;
            const inprogress = tasks.filter(t => t.status === 'inprogress').length;
            const done = tasks.filter(t => t.status === 'done').length;
            const rate = total > 0 ? Math.round((done / total) * 100) : 0;

            const todayStr = formatDate(new Date());
            const urgent = tasks.filter(t => {
                if (t.status === 'done') return false;
                const due = new Date(t.dueDate + 'T23:59:59');
                const diffDays = Math.ceil((due - new Date()) / (1000 * 60 * 60 * 24));
                return diffDays <= 1; // 오늘/내일 마감 포함 및 지연
            }).length;

            document.getElementById('stat-total').textContent = `${total}건`;
            document.getElementById('stat-inprogress').textContent = `${inprogress}건`;
            document.getElementById('stat-done').textContent = `${done}건`;
            document.getElementById('stat-rate').textContent = `${rate}%`;
            document.getElementById('stat-urgent').textContent = `${urgent}건`;
        }

        // --- 5. 필터 변경 처리 ---
        function setFilter(filterType) {
            currentFilter = filterType;
            
            // 버튼 액티브 클래스 업데이트
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'border-slate-300', 'text-slate-900', 'font-semibold', 'shadow-xs');
                btn.classList.add('border-transparent', 'text-slate-600');
            });

            const activeBtn = document.getElementById(`filter-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'border-slate-300', 'text-slate-900', 'font-semibold', 'shadow-xs');
                activeBtn.classList.remove('border-transparent', 'text-slate-600');
            }

            renderBoard();
        }

        // --- 6. 업무 생성 / 수정 모달 로직 ---
        function openTaskModal(prefilledStatus = 'todo') {
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').textContent = '새 업무 추가';
            document.getElementById('taskForm').reset();
            
            // 기본값 세팅
            document.getElementById('taskStatus').value = prefilledStatus;
            document.getElementById('taskDueDate').value = formatDate(new Date());
            document.getElementById('taskPriority').value = '보통';
            document.getElementById('taskCategory').value = '보고';
            document.getElementById('taskAssignee').value = '본인';

            document.getElementById('taskModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('taskTitle').focus(), 50);
        }

        function editTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            document.getElementById('taskId').value = task.id;
            document.getElementById('modalTitle').textContent = '업무 수정';
            document.getElementById('taskStatus').value = task.status;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDueDate').value = task.dueDate;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskCategory').value = task.category;
            document.getElementById('taskAssignee').value = task.assignee || '';
            document.getElementById('taskDesc').value = task.desc || '';

            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const dueDate = document.getElementById('taskDueDate').value;
            const priority = document.getElementById('taskPriority').value;
            const category = document.getElementById('taskCategory').value;
            const assignee = document.getElementById('taskAssignee').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const status = document.getElementById('taskStatus').value;

            if (!title || !dueDate) {
                showToast("업무명과 마감일을 반드시 입력해주세요.");
                return;
            }

            if (id) {
                // 수정
                const targetTask = tasks.find(t => t.id === id);
                if (targetTask) {
                    targetTask.title = title;
                    targetTask.dueDate = dueDate;
                    targetTask.priority = priority;
                    targetTask.category = category;
                    targetTask.assignee = assignee;
                    targetTask.desc = desc;
                    targetTask.status = status;
                    showToast("업무 내용이 수정되었습니다.");
                }
            } else {
                // 새 업무 추가
                const newTask = {
                    id: 'task-' + Date.now(),
                    title,
                    dueDate,
                    priority,
                    category,
                    assignee,
                    desc,
                    status,
                    createdAt: new Date().toISOString()
                };
                tasks.unshift(newTask);
                showToast("새 업무가 성공적으로 등록되었습니다.");
            }

            saveTasks();
            renderBoard();
            closeTaskModal();
        }

        function deleteTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // UI 내 커스텀 동작: 삭제 확인 토스트 또는 안전 삭제
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
            renderBoard();
            showToast("업무가 삭제되었습니다.");
        }

        // --- 7. 완료 업무 정리 & 전체 데이터 초기화 ---
        function clearCompletedTasks() {
            const completedCount = tasks.filter(t => t.status === 'done').length;
            if (completedCount === 0) {
                showToast("정리할 완료 업무가 없습니다.");
                return;
            }

            tasks = tasks.filter(t => t.status !== 'done');
            saveTasks();
            renderBoard();
            showToast(`완료된 업무 ${completedCount}건을 정리했습니다.`);
        }

        function resetAllData() {
            tasks = JSON.parse(JSON.stringify(defaultTasks));
            saveTasks();
            setFilter('all');
            document.getElementById('searchInput').value = '';
            renderBoard();
            showToast("샘플 업무 데이터로 초기화되었습니다.");
        }

        // --- 8. 주간 업무보고 텍스트 생성기 ---
        function openWeeklyReportModal() {
            const today = new Date();
            const todayStr = formatDate(today);

            // 1. 이번 주 완료 업무
            const doneTasks = tasks.filter(t => t.status === 'done');

            // 2. 진행 중 업무
            const inProgressTasks = tasks.filter(t => t.status === 'inprogress');

            // 3. 주요 이슈 (마감이 지났거나, 검토 단계이거나, 우선순위가 높은 미완료 건)
            const issueTasks = tasks.filter(t => {
                if (t.status === 'done') return false;
                const isOverdue = t.dueDate < todayStr;
                const isReview = t.status === 'review';
                return isOverdue || isReview;
            });

            // 4. 다음 주 / 향후 예정 업무 (할 일 상태인 업무)
            const upcomingTasks = tasks.filter(t => t.status === 'todo');

            // 텍스트 빌딩
            let report = `[주간 업무 보고서]\n작성일자: ${todayStr}\n작성자: 본인\n\n`;

            report += `[이번 주 완료 업무]\n`;
            if (doneTasks.length === 0) {
                report += ` - 완료 내역 없음\n`;
            } else {
                doneTasks.forEach((t, i) => {
                    report += ` ${i + 1}. [${t.category}] ${t.title} (완료일/마감: ${t.dueDate}${t.assignee ? `, 담당: ${t.assignee}` : ''})\n`;
                });
            }
            report += `\n`;

            report += `[진행 중 업무]\n`;
            if (inProgressTasks.length === 0) {
                report += ` - 진행 중인 업무 없음\n`;
            } else {
                inProgressTasks.forEach((t, i) => {
                    const descStr = t.desc ? ` - ${t.desc}` : '';
                    report += ` ${i + 1}. [${t.category}] ${t.title} (~${t.dueDate}${t.assignee ? `, 담당: ${t.assignee}` : ''})${descStr}\n`;
                });
            }
            report += `\n`;

            report += `[주요 이슈 및 검토사항]\n`;
            if (issueTasks.length === 0) {
                report += ` - 특이 이슈 및 지연 업무 없음\n`;
            } else {
                issueTasks.forEach((t, i) => {
                    const isOverdue = t.dueDate < todayStr;
                    const statusDesc = isOverdue ? `마감기한 초과(${t.dueDate})` : `검토 대기 중`;
                    report += ` ${i + 1}. [${t.category}] ${t.title} [${statusDesc}]\n    * 내용: ${t.desc || '세부 검토 진행 필요'}\n`;
                });
            }
            report += `\n`;

            report += `[다음 주 예정 업무]\n`;
            if (upcomingTasks.length === 0) {
                report += ` - 예정된 신규 업무 없음\n`;
            } else {
                upcomingTasks.forEach((t, i) => {
                    report += ` ${i + 1}. [${t.category}] ${t.title} (목표: ${t.dueDate}, 중요도: ${t.priority})\n`;
                });
            }

            document.getElementById('weeklyReportText').value = report;
            document.getElementById('copyToast').classList.add('hidden');
            document.getElementById('weeklyReportModal').classList.remove('hidden');
        }

        function closeWeeklyReportModal() {
            document.getElementById('weeklyReportModal').classList.add('hidden');
        }

        function copyWeeklyReport() {
            const reportArea = document.getElementById('weeklyReportText');
            reportArea.select();
            reportArea.setSelectionRange(0, 99999); // 모바일 지원

            try {
                // iframe 및 브라우저 호환성을 위한 execCommand 복사 방식
                const successful = document.execCommand('copy');
                if (successful) {
                    const copyToast = document.getElementById('copyToast');
                    copyToast.classList.remove('hidden');
                    setTimeout(() => {
                        copyToast.classList.add('hidden');
                    }, 3000);
                } else {
                    showToast("복사에 실패했습니다. 텍스트를 직접 드래그하여 복사해주세요.");
                }
            } catch (err) {
                showToast("복사 명령을 실행할 수 없습니다.");
            }
        }

        // --- 9. 유틸리티 (토스트, 이스케이프) ---
        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('systemToast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;

            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // 모달 바깥 배경 클릭 시 닫기
        window.addEventListener('click', (e) => {
            const taskModal = document.getElementById('taskModal');
            const weeklyModal = document.getElementById('weeklyReportModal');
            if (e.target === taskModal) closeTaskModal();
            if (e.target === weeklyModal) closeWeeklyReportModal();
        });

        // ESC 키로 모달 닫기
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeTaskModal();
                closeWeeklyReportModal();
            }
        });

        // --- 초기 실행 ---
        window.onload = function() {
            loadTasks();
            initDragAndDrop();
            renderBoard();
        };
    </script>
</body>
</html>
